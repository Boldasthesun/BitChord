# Builds a local-only BitChord APK on GitHub's servers, so no computer is needed.
# Put this file at .github/workflows/build-apk.yml in your fork, next to
# .github/scripts/local_only_patch.py. Then: Actions -> Build local-only APK -> Run workflow.
name: Build local-only APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" > /dev/null || true

      - name: Apply the local-only patch
        run: python3 .github/scripts/local_only_patch.py .

      - name: Build the dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace

      - name: Show what was built
        if: always()
        run: |
          find app/build/outputs/apk -name "*.apk" -printf "%s bytes  %p\n" 2>/dev/null | sort -n || true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-local-only
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
            app/build/outputs/apk/dev/debug/*armeabi-v7a*.apk
